<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson — Curriculum: Zero to AI Engineer</title>
  <meta name="description" content="Four Beats curriculum lesson: What broke, the fix, what it cost, and the interview question.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <div class="scroll-progress-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="header-inner">
      <a href="./index.html" class="site-brand">
        <span class="brand-symbol">0→L</span>
        <span class="brand-name">Curriculum</span>
      </a>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="./index.html" class="nav-link">Curriculum Map</a>
        <a href="./languages.html" class="nav-link">Language Chain</a>
        <a href="./words.html" class="nav-link">Word Lists</a>
        <a href="./progress.html" class="nav-link">Progress</a>
        <button type="button" class="theme-toggle-btn" aria-label="Toggle visual theme">Dark</button>
      </nav>
    </div>
  </header>

  <main id="main" class="main-wrapper page-entrance">
    <div id="lesson-content-mount">
      <!-- Populated by JavaScript -->
      <div class="inverted-band">
        <p class="signal-text">Loading lesson story...</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-copy">Curriculum — Zero to AI Engineer</span>
      <span class="footer-meta" id="footer-stats-line">0 tasks completed</span>
    </div>
  </footer>

  <script src="./data.js"></script>
  <script src="./lessons-data.js"></script>
  <script src="./app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.CURRICULUM || !window.CurriculumLessons) return;

      const params = new URLSearchParams(window.location.search);
      const taskId = params.get('id') || '0.6';

      const contentEl = document.getElementById('lesson-content-mount');

      const lesson = window.CurriculumLessons.getLesson(taskId);

      // Two different absences, which used to look identical. A task that
      // exists but has no lesson written is the normal state of most of this
      // curriculum, and saying so is the point: the site used to fill that
      // silence with a template that asserted nothing and sounded like it did.
      if (!lesson) {
        let owningTrack = null;
        let task = null;
        for (const t of window.CURRICULUM.tracks) {
          const found = t.tasks.find(x => x.id === taskId);
          if (found) { owningTrack = t; task = found; break; }
        }

        if (!task) {
          contentEl.innerHTML = `
            <div class="inverted-band">
              <h1>No such task</h1>
              <p>Nothing in the curriculum has the ID "${escapeHtml(taskId)}".</p>
              <a href="./index.html" class="btn" style="margin-top: 1rem; background: var(--inv-signal); color: var(--inv-bg);">Return to Curriculum Map</a>
            </div>
          `;
          return;
        }

        const adjacentMissing = window.CurriculumLessons.getAdjacentLessons(taskId);
        contentEl.innerHTML = `
          <div class="lesson-meta-bar">
            <div class="lesson-breadcrumbs">
              <a href="./index.html">Curriculum Map</a>
              <span>/</span>
              <a href="./track.html?id=${owningTrack.id}">Track ${owningTrack.id}: ${escapeHtml(owningTrack.name)}</a>
              <span>/</span>
              <span>${escapeHtml(taskId)}</span>
            </div>
          </div>
          <div class="inverted-band">
            <span class="track-card-letter" style="color: var(--inv-signal); font-size: var(--t-0); display: block; margin-bottom: 0.5rem;">${escapeHtml(taskId)}</span>
            <h1>${escapeHtml(task.text)}</h1>
            <p style="max-inline-size: 62ch;">This task is on the curriculum. The lesson has not been written yet.</p>
            <p style="max-inline-size: 62ch; opacity: 0.75; font-size: var(--t--1);">It is left blank on purpose. A lesson here would have to name what broke, who fixed it, in what year, and what the fix cost, with each of those traceable to a source. Until it does, an empty space is the honest answer.</p>
            <div style="margin-top: 1.25rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
              <a href="./track.html?id=${owningTrack.id}" class="btn" style="background: var(--inv-signal); color: var(--inv-bg); border: none;">Back to Track ${owningTrack.id}</a>
              ${adjacentMissing.next ? `<a href="./lesson.html?id=${adjacentMissing.next}" class="btn" style="color: var(--inv-ink); border-color: rgba(239,235,227,0.35);">Next task &rarr;</a>` : ''}
            </div>
          </div>
        `;
        document.title = `${taskId}: ${task.text} — not written yet`;
        return;
      }

      // Update page title
      document.title = `${lesson.id}: ${lesson.title} — Four Beats Lesson`;

      // Find track
      const track = window.CURRICULUM.tracks.find(t => t.id === lesson.trackId);
      const trackName = track ? track.name : (lesson.trackName || "Track " + lesson.trackId);
      const isCompleted = window.CurriculumApp.isTaskCompleted(lesson.id);

      // Adjacent lessons
      const adjacent = window.CurriculumLessons.getAdjacentLessons(lesson.id);
      const prevLesson = adjacent.prev ? window.CurriculumLessons.getLesson(adjacent.prev) : null;
      const nextLesson = adjacent.next ? window.CurriculumLessons.getLesson(adjacent.next) : null;

      // Format story into paragraphs if it's a long string
      const storyParagraphs = lesson.story
        .split('\n\n')
        .map(p => p.trim())
        .filter(Boolean)
        .map(p => `<p>${p}</p>`)
        .join('');

      let html = `
        <div class="lesson-meta-bar">
          <div class="lesson-breadcrumbs">
            <a href="./index.html">Curriculum Map</a>
            <span>/</span>
            <a href="./track.html?id=${lesson.trackId}">Track ${lesson.trackId}: ${trackName}</a>
            <span>/</span>
            <span>Task ${lesson.id}</span>
          </div>

          <div>
            <span class="track-card-count" id="completion-status-pill" style="color: ${isCompleted ? '#2b8a3e' : 'var(--ink-2)'}; font-weight: 800;">
              ${isCompleted ? '✓ Completed' : '○ Not yet completed'}
            </span>
          </div>
        </div>

        <section class="inverted-band lesson-header-card" aria-labelledby="lesson-main-heading">
          <span class="lesson-number-badge">TRACK ${lesson.trackId} · LESSON ${lesson.id}</span>
          <h1 id="lesson-main-heading" class="lesson-main-title">${lesson.title}</h1>
          <p style="color: var(--inv-ink); opacity: 0.85; max-inline-size: 65ch; margin-bottom: 0.5rem;">
            Part of <strong>${trackName}</strong>. Taught strictly through the Four Beats pedagogical rule: what broke, the fix, what it cost, and the interview question.
          </p>
        </section>

        <!-- Provenance. A reader is never shown unmarked prose of unknown
             origin: either its facts are traced to sources, a person has
             checked it, or the page says neither has happened yet. -->
        ${provenanceBanner(lesson)}

        <!-- Core Takeaway Banner -->
        ${lesson.takeaway ? `
          <div class="lesson-takeaway-banner" role="note" aria-label="Core Engineering Invariant">
            <strong>Core Invariant:</strong> "${lesson.takeaway}"
          </div>
        ` : ''}

        <!-- The Historical & Architectural Narrative -->
        <section class="section-block lesson-story-block" aria-labelledby="story-heading">
          <div class="section-header">
            <h2 id="story-heading">The Story & Engineering Reality</h2>
            <span class="section-counter">Historical Context</span>
          </div>
          <div class="lesson-story-text">
            ${storyParagraphs}
          </div>
        </section>

        <!-- Solving problems with it. Placed before the Beats on purpose:
             what it is for, then how to recognise the situation, and only
             then why it came to exist. That order makes the history mean
             something instead of being trivia. -->
        ${problemBlock(lesson)}

        <!-- The Four Beats Interactive Experience -->
        <section class="section-block" aria-labelledby="beats-heading">
          <div class="section-header">
            <h2 id="beats-heading">The Four Beats of Mastery</h2>
            <span class="section-counter">Instructional Sequence</span>
          </div>

          <div class="lesson-beats-stack">
            <!-- Beat 1: What Broke -->
            <article class="beat-card" id="beat-1">
              <div class="beat-card-header">
                <span class="beat-card-badge badge-beat1">BEAT 01</span>
                <span style="font-family: var(--font-display); font-weight: 800; font-size: var(--t-0); color: #c92a2a;">What Broke</span>
              </div>
              <p class="beat-card-content">${lesson.beats.broke}</p>
            </article>

            <!-- Beat 2: The Fix -->
            <article class="beat-card" id="beat-2">
              <div class="beat-card-header">
                <span class="beat-card-badge badge-beat2">BEAT 02</span>
                <span style="font-family: var(--font-display); font-weight: 800; font-size: var(--t-0); color: var(--signal);">The Fix</span>
              </div>
              <p class="beat-card-content">${lesson.beats.fix}</p>
            </article>

            <!-- Beat 3: What It Cost -->
            <article class="beat-card" id="beat-3">
              <div class="beat-card-header">
                <span class="beat-card-badge badge-beat3">BEAT 03</span>
                <span style="font-family: var(--font-display); font-weight: 800; font-size: var(--t-0); color: #c07700;">What It Cost</span>
              </div>
              <p class="beat-card-content">${lesson.beats.cost}</p>
            </article>

            <!-- Beat 4: Interview Question -->
            <article class="beat-card" id="beat-4">
              <div class="beat-card-header">
                <span class="beat-card-badge badge-beat4">BEAT 04</span>
                <span style="font-family: var(--font-display); font-weight: 800; font-size: var(--t-0); color: #2b8a3e;">The Interview Question</span>
              </div>
              <div class="beat-card-content">
                <p style="font-weight: 600; margin-bottom: 0.5rem; font-size: var(--t-0);">
                  "${typeof lesson.beats.interview === 'object' ? lesson.beats.interview.q : lesson.beats.interview}"
                </p>

                ${typeof lesson.beats.interview === 'object' && lesson.beats.interview.trap ? `
                  <div class="interview-trap-box">
                    <span class="interview-trap-title">⚠️ Common Candidate Trap:</span>
                    <span>${lesson.beats.interview.trap}</span>
                  </div>
                ` : ''}

                ${typeof lesson.beats.interview === 'object' && lesson.beats.interview.answer ? `
                  <button type="button" class="interview-answer-reveal-btn" id="reveal-answer-btn" aria-expanded="false" aria-controls="answer-panel">
                    <span>Reveal Senior Engineer Answer ↓</span>
                  </button>
                  <div class="interview-answer-panel" id="answer-panel" role="region" aria-label="Model Answer">
                    <strong style="font-family: var(--font-display); display: block; margin-bottom: 0.5rem; color: #2b8a3e;">Model Answer:</strong>
                    <p style="margin-bottom: 0;">${lesson.beats.interview.answer}</p>
                  </div>
                ` : ''}
              </div>
            </article>
          </div>
        </section>

        <!-- The Code / Architectural Blueprint -->
        ${lesson.blueprint ? `
          <section class="section-block" aria-labelledby="blueprint-heading">
            <div class="section-header">
              <h2 id="blueprint-heading">The Code / Concrete Blueprint</h2>
              <span class="section-counter">Implementation Pattern</span>
            </div>
            <div class="blueprint-card">
              <p style="font-size: var(--t--1); color: var(--ink-2); margin-bottom: 0.5rem;">
                The concrete code invariant, verification, or syntax in production:
              </p>
              <pre class="code-pre"><code>${escapeHtml(lesson.blueprint)}</code></pre>
            </div>
          </section>
        ` : ''}

        <!-- The evidence. Claim first, source second — the same order the gate
             works in, and the reason a bare list of urls would not do: the
             checkable thing is the sentence, and the source is evidence for
             that sentence rather than for the lesson as a whole. -->
        ${sourcesSection(lesson)}

        <!-- Interactive Completion Toggle -->
        <div class="lesson-completion-bar" role="region" aria-label="Task Completion Toggle">
          <div>
            <strong style="font-family: var(--font-display); font-size: var(--t-0); display: block;">Track Progress</strong>
            <span style="font-size: var(--t--1); color: var(--ink-2);">Mark this task as mastered to update your global curriculum dashboard.</span>
          </div>
          <button type="button" class="lesson-toggle-btn ${isCompleted ? 'completed' : ''}" id="lesson-toggle-complete-btn" aria-pressed="${isCompleted}">
            <span id="lesson-toggle-icon">${isCompleted ? '✓' : '○'}</span>
            <span id="lesson-toggle-text">${isCompleted ? 'Completed (Click to undo)' : 'Mark Task as Completed'}</span>
          </button>
        </div>

        <!-- Sequence Pagination Navigation -->
        <nav class="lesson-nav-bar" aria-label="Lesson sequence pagination">
          <div>
            ${prevLesson ? `
              <a href="./lesson.html?id=${prevLesson.id}" class="btn" style="text-align: left; width: 100%;">
                ← ${prevLesson.id}: ${truncate(prevLesson.title, 32)}
              </a>
            ` : `
              <a href="./track.html?id=${lesson.trackId}" class="btn" style="text-align: left; width: 100%;">
                ← Track ${lesson.trackId} Overview
              </a>
            `}
          </div>

          <div style="text-align: center;">
            <a href="./track.html?id=${lesson.trackId}" class="btn" style="border: none; font-weight: 800;">
              All Tasks in Track ${lesson.trackId}
            </a>
          </div>

          <div style="text-align: right;">
            ${nextLesson ? `
              <a href="./lesson.html?id=${nextLesson.id}" class="btn btn-primary" style="text-align: right; width: 100%;">
                ${nextLesson.id}: ${truncate(nextLesson.title, 32)} →
              </a>
            ` : `
              <a href="./progress.html" class="btn btn-primary" style="text-align: right; width: 100%;">
                View Progress Overview →
              </a>
            `}
          </div>
        </nav>

        <!-- Quick Track Tasks List Drawer -->
        ${track && track.tasks ? `
          <section class="section-block" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--rule);" aria-labelledby="track-tasks-heading">
            <div class="section-header">
              <h2 id="track-tasks-heading">Other Lessons in Track ${track.id}</h2>
              <span class="section-counter">${track.tasks.length} Total</span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr)); gap: 0.75rem;">
              ${track.tasks.map(t => {
                const isThisOne = t.id === lesson.id;
                const isTaskDone = window.CurriculumApp.isTaskCompleted(t.id);
                return `
                  <a href="./lesson.html?id=${t.id}" class="interactive-item" style="display: flex; align-items: baseline; gap: 0.5rem; padding: 0.75rem 1rem; border: 1px solid ${isThisOne ? 'var(--signal)' : 'var(--rule-soft)'}; background-color: ${isThisOne ? 'var(--raise)' : 'transparent'}; text-decoration: none; color: var(--ink);">
                    <span style="font-family: var(--font-display); font-weight: 800; font-size: var(--t--1); color: ${isThisOne ? 'var(--signal)' : 'var(--ink-2)'}; min-width: 2.5rem;">${t.id}</span>
                    <span style="font-size: var(--t--1); line-height: 1.4; flex: 1; ${isTaskDone ? 'text-decoration: line-through; opacity: 0.7;' : ''}">${truncate(t.text, 45)}</span>
                    ${isTaskDone ? '<span style="color: #2b8a3e; font-weight: bold; font-size: 0.8rem;">✓</span>' : ''}
                  </a>
                `;
              }).join('')}
            </div>
          </section>
        ` : ''}
      `;

      contentEl.innerHTML = html;

      // Event listener: Reveal Interview Answer
      const revealBtn = document.getElementById('reveal-answer-btn');
      const answerPanel = document.getElementById('answer-panel');
      if (revealBtn && answerPanel) {
        revealBtn.addEventListener('click', () => {
          const isRevealed = answerPanel.classList.toggle('revealed');
          revealBtn.setAttribute('aria-expanded', isRevealed);
          revealBtn.innerHTML = isRevealed ? 'Hide Answer ↑' : 'Reveal Senior Engineer Answer ↓';
        });
      }

      // Event listener: Toggle Complete Button
      const toggleBtn = document.getElementById('lesson-toggle-complete-btn');
      const toggleText = document.getElementById('lesson-toggle-text');
      const toggleIcon = document.getElementById('lesson-toggle-icon');
      const statusPill = document.getElementById('completion-status-pill');

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          const currentlyDone = window.CurriculumApp.isTaskCompleted(lesson.id);
          const newDone = !currentlyDone;
          window.CurriculumApp.setTaskCompleted(lesson.id, newDone);

          toggleBtn.classList.toggle('completed', newDone);
          toggleBtn.setAttribute('aria-pressed', newDone);
          if (toggleIcon) toggleIcon.textContent = newDone ? '✓' : '○';
          if (toggleText) toggleText.textContent = newDone ? 'Completed (Click to undo)' : 'Mark Task as Completed';
          if (statusPill) {
            statusPill.textContent = newDone ? '✓ Completed' : '○ Not yet completed';
            statusPill.style.color = newDone ? '#2b8a3e' : 'var(--ink-2)';
          }
          updateFooterStats();
        });
      }

      function updateFooterStats() {
        const stats = window.CurriculumApp.getTotalStats();
        const footerEl = document.getElementById('footer-stats-line');
        if (footerEl) {
          footerEl.textContent = `${stats.completed} / ${stats.total} tasks completed (${stats.percent}%)`;
        }
      }

      updateFooterStats();

      // Listen for progress updates from other tabs
      window.addEventListener('curriculum-progress-updated', () => {
        const nowDone = window.CurriculumApp.isTaskCompleted(lesson.id);
        if (toggleBtn) {
          toggleBtn.classList.toggle('completed', nowDone);
          toggleBtn.setAttribute('aria-pressed', nowDone);
        }
        if (toggleIcon) toggleIcon.textContent = nowDone ? '✓' : '○';
        if (toggleText) toggleText.textContent = nowDone ? 'Completed (Click to undo)' : 'Mark Task as Completed';
        if (statusPill) {
          statusPill.textContent = nowDone ? '✓ Completed' : '○ Not yet completed';
          statusPill.style.color = nowDone ? '#2b8a3e' : 'var(--ink-2)';
        }
        updateFooterStats();
      });

      function truncate(str, max) {
        if (!str) return '';
        return str.length > max ? str.substring(0, max - 1) + '…' : str;
      }

      /**
       * Three states, and the reader can tell them apart at a glance:
       *
       *   unsourced  written before sourcing was required, no claims attached
       *   traced     every date, figure and name in it is licensed by a
       *              sourced claim, checked mechanically
       *   verified   traced, and then read and accepted by a person
       *
       * There is no state for "failed the check": such a lesson is never
       * written to content/, so it cannot reach this page.
       */
      function provenanceBanner(lesson) {
        const states = {
          unsourced: {
            label: 'Not yet sourced',
            text: 'This lesson was written before sources were required. Its dates and figures have not been traced, so treat them as a starting point to check rather than a fact to quote.',
            tone: 'warn',
          },
          traced: {
            label: 'Sources traced',
            text: 'Every date, figure and name in this lesson is licensed by a claim with a source. Nobody has read it end to end yet.',
            tone: 'ok',
          },
          verified: {
            label: 'Verified',
            text: 'Traced to sources and read end to end by a person.',
            tone: 'ok',
          },
        };
        const state = states[lesson.status];
        if (!state) return '';
        // A badge that asserts provenance without showing it asks to be taken
        // on trust. Where the evidence exists, the badge is a route to it.
        const sources = window.CurriculumLessons.getSources(lesson.id);
        const link = sources && sources.length
          ? ` <a class="provenance-link" href="#sources">Read the ${sources.length} claims and their sources ↓</a>`
          : '';
        return `
          <div class="provenance-banner provenance-${state.tone}" role="note">
            <span class="provenance-label">${state.label}</span>
            <span class="provenance-text">${state.text}${link}</span>
          </div>
        `;
      }

      /**
       * Every claim behind the lesson, with what each one rests on.
       *
       * Two claims leaning on the same document stay two entries. Collapsing
       * them into a reading list would show the evidence and hide what it was
       * evidence for, and the checkable thing is the sentence, not the url.
       *
       * Primary and secondary are marked because they are not interchangeable:
       * a participant's own account and a later retelling of it fail in
       * different ways, and a reader deciding how hard to push on a claim
       * needs to know which one is underneath it.
       */
      function sourcesSection(lesson) {
        const sources = window.CurriculumLessons.getSources(lesson.id);
        if (!sources || !sources.length) return '';

        const items = sources.map(function (s) {
          return `
            <li class="source-entry">
              <p class="source-claim">${escapeHtml(s.claim)}</p>
              <p class="source-cite">
                <a href="${escapeHtml(s.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(s.title)}</a>
                <span class="source-kind source-kind-${escapeHtml(s.kind)}">${escapeHtml(s.kind)}</span>
              </p>
            </li>`;
        }).join('');

        return `
          <section id="sources" class="section-block" aria-labelledby="sources-heading">
            <div class="section-header">
              <h2 id="sources-heading">Sources</h2>
              <span class="section-counter">${sources.length} claims</span>
            </div>
            <p class="source-note">
              Each entry is a statement that could be wrong, followed by what it rests on.
              <strong>Primary</strong> is the document itself or the account of someone who was there;
              <strong>secondary</strong> is a later retelling. Every date, figure and name in the lesson
              above is licensed by one of these \u2014 that is what the badge at the top means, and this
              is the evidence for it.
            </p>
            <ol class="source-list">${items}</ol>
          </section>`;
      }

      /**
       * The problem this solves, and what it is called.
       *
       * The name is given its own line because it is the handle you search
       * on: a reader who knows this is the single-source shortest path
       * problem can find fifty years of work on it, and a reader who only
       * knows "find the cheapest route" cannot.
       *
       * invariant and breaks are paired visually because they are one idea
       * seen from both sides — what must hold, and the condition that voids
       * it. That pair is the difference between reciting a technique and
       * choosing one.
       */
      function problemBlock(lesson) {
        const p = lesson.problem;
        if (!p) return '';

        const aka = Array.isArray(p.aka) && p.aka.length
          ? ` <span class="problem-aka">also: ${p.aka.map(escapeHtml).join(', ')}</span>` : '';

        return `
          <section class="section-block" aria-labelledby="problem-heading">
            <div class="section-header">
              <h2 id="problem-heading">The problem it solves</h2>
              <span class="section-counter">Named &amp; recognised</span>
            </div>

            <div class="problem-name-card">
              <span class="problem-name-label">The problem is called</span>
              <p class="problem-name">${escapeHtml(p.name)}${aka}</p>
              ${p.shape ? `<p class="problem-shape">${escapeHtml(p.shape)}</p>` : ''}
            </div>

            ${Array.isArray(p.tell) && p.tell.length ? `
              <div class="problem-sub">
                <h3>How you recognise it</h3>
                <ul class="problem-tell">
                  ${p.tell.map(t => `<li>${escapeHtml(t)}</li>`).join('')}
                </ul>
              </div>` : ''}

            ${p.move ? `
              <div class="problem-sub">
                <h3>The move</h3>
                <p>${escapeHtml(p.move)}</p>
              </div>` : ''}

            <div class="problem-pair">
              <div class="problem-pair-half problem-holds">
                <span class="problem-pair-label">What must stay true</span>
                <p>${escapeHtml(p.invariant)}</p>
              </div>
              <div class="problem-pair-half problem-voids">
                <span class="problem-pair-label">What voids it</span>
                <p>${escapeHtml(p.breaks)}</p>
              </div>
            </div>

            ${p.cost ? `
              <div class="problem-cost">
                <span class="problem-cost-item"><strong>Time</strong> <code>${escapeHtml(p.cost.time)}</code></span>
                ${p.cost.space ? `<span class="problem-cost-item"><strong>Space</strong> <code>${escapeHtml(p.cost.space)}</code></span>` : ''}
                ${p.cost.beats ? `<span class="problem-cost-item"><strong>Beats</strong> ${escapeHtml(p.cost.beats)}</span>` : ''}
              </div>` : ''}

            ${p.worked ? `
              <div class="problem-sub problem-worked">
                <h3>Worked through</h3>
                ${p.worked.problem ? `<p class="problem-worked-q">${escapeHtml(p.worked.problem)}</p>` : ''}
                ${p.worked.reasoning ? `<p>${escapeHtml(p.worked.reasoning)}</p>` : ''}
                ${p.worked.code ? `<pre class="code-pre"><code>${escapeHtml(p.worked.code)}</code></pre>` : ''}
              </div>` : ''}

            ${p.practice ? `
              <div class="problem-practice">
                <span class="problem-practice-label">Now you</span>
                <p>${escapeHtml(p.practice)}</p>
              </div>` : ''}
          </section>
        `;
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }
    });
  </script>
</body>
</html>
